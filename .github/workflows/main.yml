name: Continuous Kernel Build & Release

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KBUILD_BUILD_USER: NATO66613
      KBUILD_BUILD_HOST: KREMLIN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          create-symlink: true
          key: kernel-build-cache
          restore-keys: |
            kernel-build-cache
          max-size: '10G'

      - name: Restore Clang cache
        id: restore-clang
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex libelf-dev libncurses-dev libssl-dev unzip zip wget libarchive-tools
          ccache --show-stats

      - name: Deploy Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git /home/runner/r547379 --depth=1

      - name: Save Clang
        if: steps.restore-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/r547379
          key: clang-r547379

      - name: Build the kernel with ccache (Unsigned, O=out)
        run: |
          export CLANG_PATH=$HOME/r547379/bin
          export PATH=${CLANG_PATH}:${PATH}

          make O=out mrproper
          make O=out raphael_defconfig

          # Disable module signature verification
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable MODULE_SIG_ALL
          scripts/config --file out/.config --disable MODULE_SIG_FORCE

          # Sync config
          make O=out olddefconfig

          # Build
          make O=out LLVM=1 LLVM_IAS=1 CC="ccache clang" -j$(nproc)

          ccache --show-stats

      - name: Repack Kernel with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/SOVIET-ANDROID/AnyKernel3.git $HOME/AnyKernel3

          # Copy kernel images (safe way)
          cp out/arch/arm64/boot/Image* $HOME/AnyKernel3/ || true
          cp out/arch/arm64/boot/dtbo.img $HOME/AnyKernel3/ || true

          # Generate ZIP name
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's|/|-|g')
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c1-6)
          ZIP_NAME="${BRANCH}-${COMMIT_HASH}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

          # Make flashable zip
          cd $HOME/AnyKernel3
          zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" *

          ls -lah $GITHUB_WORKSPACE

      - name: Create GitHub Release and Upload ZIP
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kernel Build ${{ github.run_number }}
          files: ${{ github.workspace }}/${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
