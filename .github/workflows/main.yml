      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$HOME/toolchains/gcc64/bin:$HOME/toolchains/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang

          cd $GITHUB_WORKSPACE

          # Replace with your actual defconfig
          make raphael_defconfig

          # Force-enable module configs
          if [ -f ./scripts/config ]; then
            ./scripts/config --set-val CONFIG_MODULES y || true
            ./scripts/config --set-val CONFIG_MODULE_UNLOAD y || true
            ./scripts/config --set-val CONFIG_MODVERSIONS y || true
            ./scripts/config --disable CONFIG_MODULE_SIG || true
            ./scripts/config --disable CONFIG_MODULE_SIG_ALL || true
            ./scripts/config --set-str CONFIG_MODULE_SIG_KEY "" || true
            ./scripts/config --disable CONFIG_IMA || true
            ./scripts/config --disable CONFIG_IMA_APPRAISE || true
            ./scripts/config --disable CONFIG_LOCK_DOWN_LSM || true
          else
            # Fallback: edit .config directly
            sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' .config || true
            grep -q "CONFIG_MODULES=y" .config || echo "CONFIG_MODULES=y" >> .config

            sed -i 's/# CONFIG_MODULE_UNLOAD is not set/CONFIG_MODULE_UNLOAD=y/' .config || true
            grep -q "CONFIG_MODULE_UNLOAD=y" .config || echo "CONFIG_MODULE_UNLOAD=y" >> .config

            sed -i 's/# CONFIG_MODVERSIONS is not set/CONFIG_MODVERSIONS=y/' .config || true
            grep -q "CONFIG_MODVERSIONS=y" .config || echo "CONFIG_MODVERSIONS=y" >> .config

            sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/' .config || true
            sed -i 's/CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/' .config || true
            sed -i 's/CONFIG_IMA=y/# CONFIG_IMA is not set/' .config || true
            sed -i 's/CONFIG_IMA_APPRAISE=y/# CONFIG_IMA_APPRAISE is not set/' .config || true
            sed -i 's/CONFIG_LOCK_DOWN_LSM=y/# CONFIG_LOCK_DOWN_LSM is not set/' .config || true
          fi

          # Finalize config
          make olddefconfig

          # Strong verification
          grep -q "CONFIG_MODULES=y" .config || { echo "❌ CONFIG_MODULES not enabled!"; exit 1; }

          # Build kernel + modules
          make -j$(nproc)
          make -j$(nproc) modules
          make INSTALL_MOD_PATH=output modules_install || true
