      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$HOME/toolchains/gcc64/bin:$HOME/toolchains/clang/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CC=clang

          cd $GITHUB_WORKSPACE

          # Use device defconfig
          make raphael_defconfig

          # Force-enable module configs
          if [ -f ./scripts/config ]; then
            ./scripts/config --set-val CONFIG_MODULES y || true
            ./scripts/config --set-val CONFIG_MODULE_UNLOAD y || true
            ./scripts/config --set-val CONFIG_MODVERSIONS y || true
          else
            sed -i 's/# CONFIG_MODULES is not set/CONFIG_MODULES=y/' .config || true
            grep -q "CONFIG_MODULES=y" .config || echo "CONFIG_MODULES=y" >> .config

            sed -i 's/# CONFIG_MODULE_UNLOAD is not set/CONFIG_MODULE_UNLOAD=y/' .config || true
            grep -q "CONFIG_MODULE_UNLOAD=y" .config || echo "CONFIG_MODULE_UNLOAD=y" >> .config
